name: CI/CD - Classificacao Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - 'classificacao-v*'
    paths:
      - 'classificacao-service/**'
      - '.github/workflows/ci-classificacao.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'classificacao-service/**'
      - '.github/workflows/ci-classificacao.yml'

jobs:
  # Build e Test
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./classificacao-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests and coverage
        run: |
          python -m pytest tests/ --cov=app --cov-report=xml


      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-classificacao
          path: ./classificacao-service/coverage.xml

  # SonarCloud
  sonarcloud:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-classificacao
          path: ./classificacao-service

      - name: SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_CLASSIFICACAO }}
        with:
          args: >
            -Dsonar.projectKey=danielibatista_triagem-final_classificacao-service
            -Dsonar.organization=danielibatista
            -Dsonar.projectName=classificacao-service
            -Dsonar.sources=classificacao-service/app
            -Dsonar.tests=classificacao-service/tests
            -Dsonar.python.coverage.reportPaths=classificacao-service/coverage.xml

  # Publicar imagem no GHCR
  publish-image:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/classificacao-service
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=classificacao-v(.*),group=1

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./classificacao-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploy DEV (develop -> Render)
  deploy-dev:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (DEV)
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CLASSIFICACAO_DEV }}"

  # Deploy HOMOL (main -> Render)
  deploy-homol:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (HOMOL)
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CLASSIFICACAO_HOMOL }}"