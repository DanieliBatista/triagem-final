name: CI - Prontuario Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - 'prontuario-v*'
    paths:
      - 'prontuario-service/**'
      - '.github/workflows/ci-prontuario.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'prontuario-service/**'
      - '.github/workflows/ci-prontuario.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./prontuario-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests and coverage
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest tests/ --cov=src --cov-report=xml

      - name: Build Docker image
        run: docker build --tag prontuario-service:${{ github.sha }} .

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-prontuario
          path: ./prontuario-service/coverage.xml

  sonarcloud:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-prontuario
          path: ./prontuario-service

      - name: SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PRONTUARIO }}
        with:
          args: >
            -Dsonar.projectKey=danielibatista_triagem-final_prontuario-service
            -Dsonar.organization=danielibatista
            -Dsonar.projectName=prontuario-service
            -Dsonar.sources=prontuario-service/src
            -Dsonar.tests=prontuario-service/tests
            -Dsonar.python.coverage.reportPaths=prontuario-service/coverage.xml

  publish-image:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/prontuario-service
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=prontuario-v(.*),group=1

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./prontuario-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
