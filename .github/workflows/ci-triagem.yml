name: CI - Triagem Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'triagem-service/**'
      - '.github/workflows/ci-triagem.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'triagem-service/**'
      - '.github/workflows/ci-triagem.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./triagem-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install pytest pytest-cov httpx

      - name: Run tests and coverage
        run: |
          python -m pytest tests/ --cov=app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-triagem
          path: ./triagem-service/coverage.xml

  sonarcloud:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-triagem
          path: ./triagem-service

      - name: SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_TRIAGEM }}
        with:
          args: >
            -Dsonar.projectBaseDir=triagem-service
            -Dsonar.projectKey=DanieliBatista_triagem-final_triagem-service
            -Dsonar.organization=danielibatista
            -Dsonar.projectName=triagem-service
            -Dsonar.sources=triagem-service/app
            -Dsonar.tests=triagem-service/tests
            -Dsonar.python.coverage.reportPaths=triagem-service/coverage.xml