name: CI - Triagem Service

# 1. Quando este pipeline vai rodar?
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'triagem-service/**' # DICA DE OURO: Só roda se alterar algo na Triagem!
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'triagem-service/**'

jobs:
  # ==========================================
  # JOB 1: BUILD E TESTES AUTOMATIZADOS
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    
    # Apontando para a pasta correta do seu microsserviço
    defaults:
      run:
        working-directory: ./triagem-service

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências da aplicação
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install pytest pytest-cov httpx

      - name: Rodar Testes e gerar relatório de cobertura
        run: |
          python -m pytest tests/ --cov=app --cov-report=xml

      # Salvando da pasta da triagem
      - name: Salvar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-triagem
          path: ./triagem-service/coverage.xml

  # ==========================================
  # JOB 2: ANÁLISE DE QUALIDADE (SONARCLOUD)
  # ==========================================
  sonarcloud:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-triagem
          path: ./triagem-service

      - name: Análise no SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=DanieliBatista_triagem-final
            -Dsonar.organization=danielibatista
            -Dsonar.python.coverage.reportPaths=triagem-service/coverage.xml
            -Dsonar.sources=triagem-service/app
            -Dsonar.tests=triagem-service/tests

  # ==========================================
  # JOB 3: VERSIONAMENTO SEMÂNTICO
  # ==========================================
  versionamento:
    needs: sonarcloud
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    steps:
      - uses: actions/checkout@v4
      
      - name: Criar Tag de Versão Automática
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor