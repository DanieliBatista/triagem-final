name: CI - Integracao Continua

# 1. Quando este pipeline vai rodar?
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ==========================================
  # JOB 1: BUILD E TESTES AUTOMATIZADOS
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Diz ao GitHub para rodar os comandos dentro do seu serviço
    defaults:
      run:
        working-directory: ./classificacao-service

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Versão que vocês estão a usar

      - name: Instalar dependências da aplicação
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install pytest pytest-cov httpx

      - name: Rodar Testes e gerar relatório de cobertura
        run: |
          python -m pytest tests/ --cov=app --cov-report=xml

      # Ajuste no caminho do artefacto para a pasta correta
      - name: Salvar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./classificacao-service/coverage.xml

  # ==========================================
  # JOB 2: ANÁLISE DE QUALIDADE (SONARCLOUD)
  # ==========================================
  sonarcloud:
    needs: build-and-test # Só roda se os testes passarem!
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o Sonar analisar o histórico

      - name: Recuperar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./classificacao-service # Descarrega o ficheiro na mesma subpasta

      - name: Análise no SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=DanieliBatista_triagem-final
            -Dsonar.organization=danielibatista
            -Dsonar.python.coverage.reportPaths=classificacao-service/coverage.xml
            -Dsonar.sources=classificacao-service/app
            -Dsonar.tests=classificacao-service/tests

  # ==========================================
  # JOB 3: VERSIONAMENTO SEMÂNTICO
  # ==========================================
  versionamento:
    needs: sonarcloud # Só cria versão se o código for aprovado
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    steps:
      - uses: actions/checkout@v4
      
      - name: Criar Tag de Versão Automática
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor