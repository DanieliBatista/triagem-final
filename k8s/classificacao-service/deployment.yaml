apiVersion: apps/v1
kind: Deployment
metadata:
  name: classificacao-service
  namespace: medsync
  labels:
    app.kubernetes.io/name: classificacao-service
    app.kubernetes.io/part-of: medsync
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: classificacao-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classificacao-service
        app.kubernetes.io/part-of: medsync
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: classificacao-service
          image: classificacao-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: classificacao-service-config
            - secretRef:
                name: classificacao-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
